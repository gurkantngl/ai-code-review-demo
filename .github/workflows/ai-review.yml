name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest

    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Mask API key
        run: echo "::add-mask::${{ secrets.OPENAI_API_KEY }}"

      - name: Run AI review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_FULL_NAME: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'gpt-4o' }}
          MAX_TOKENS_PER_CHUNK: ${{ vars.MAX_TOKENS_PER_CHUNK || '3000' }}
          MAX_CONCURRENT_REVIEWS: ${{ vars.MAX_CONCURRENT_REVIEWS || '4' }}
          REVIEW_LANGUAGE: ${{ vars.REVIEW_LANGUAGE || 'en' }}
        run: python scripts/review.py
